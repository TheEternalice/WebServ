<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightgray;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .error-container {
            text-align: center;
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        .gebzerror-code {
            font-size: 120px;
            font-weight: bold;
            color: #dc3545;
            margin: 0;
            line-height: 1;
        }
        .gebzprintmsg {
            font-size: 24px;
            color: #6c757d;
            margin: 20px 0;
        }
        .gebzprintdescription {
            color: #6c757d;
            margin-bottom: 30px;
        }
        .home-link {
            display: inline-block;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .home-link:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="gebzerror-code">404</h1>
        <h2 class="gebzprintmsg">Page Not Found</h2>
        <p class="gebzprintdescription">
            The page you're looking for doesn't exist or has been moved.
            Please check the URL and try again.
        </p>
        <a href="../" class="home-link">Go Back Home</a>
    </div>
</body>
</html>
