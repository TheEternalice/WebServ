server {
    listen 0.0.0.0:8080;
    server_name localhost;

    root ./www;
    index index.html;

    error_page 404 ./Error_pages/404.html;
    # error_page 405 ./Error_pages/405.html;

    location / {
        autoindex off;
        allow_methods GET;
    }

	location /upload {
		root ./uploads;
		allow_methods POST;
	}

	location /cgi-bin {
		root ./cgi-bin;
		allow_methods GET POST;
		cgi_extension .py .php .pl .cgi;
	}
}