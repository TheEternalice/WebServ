server {
    listen 8080;
    server_name localhost;

    root ./www;
    index index.html index.htm;
    client_max_body_size 10000000; # 10 Mo en octets

    error_page 400 /Error_pages/400.html;
    error_page 403 /Error_pages/403.html;
    error_page 404 /Error_pages/404.html;
    error_page 500 /Error_pages/500.html;

    # Bloc principal
    location / {
        autoindex on;
        allow_methods GET POST DELETE;
    }

    # Upload
    location /upload {
        root ./uploads;
        allow_methods POST;
    }

    # CGI (exemple Python + PHP)
    location /cgi-bin {
        root ./cgi-bin;
        allow_methods GET POST;
        cgi_extension .py .php;
    }

    # Redirection
    location /old {
        return 301 /new;
    }

    # Exemple DELETE
    location /delete {
        root ./uploads;
        allow_methods DELETE;
    }
}

