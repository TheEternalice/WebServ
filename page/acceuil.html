<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<title>Accueil - Mon serveur</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			background: #f4f6f8;
			margin: 0;
			padding: 0;
			display: flex;
			flex-direction: column;
			min-height: 100vh;
		}

		header {
			background: #2c3e50;
			color: white;
			padding: 20px;
			text-align: center;
		}

		main {
			flex: 1;
			display: flex;
			justify-content: center;
			align-items: center;
			flex-direction: column;
			padding: 40px;
		}

		h1 {
			margin-bottom: 20px;
			color: #2c3e50;
		}

		nav {
			margin-top: 20px;
		}

		nav a {
			text-decoration: none;
			background: #3498db;
			color: white;
			padding: 10px 20px;
			margin: 5px;
			border-radius: 5px;
			transition: background 0.3s;
		}

		nav a:hover {
			background: #2980b9;
		}

		footer {
			background: #2c3e50;
			color: white;
			text-align: center;
			padding: 10px;
		}
	</style>
</head>
