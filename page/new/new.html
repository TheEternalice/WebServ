<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Nouvelle Page – Mon serveur</title>
	<style>
		:root{
			--bg:#071022;
			--card:#0b1220;
			--accent:#3b82f6;
			--muted:#9aa6b2;
			--white:#eef2f7;
		}
		*{box-sizing:border-box}
		body{
			margin:0;
			min-height:100vh;
			display:flex;
			align-items:center;
			justify-content:center;
			background:linear-gradient(180deg,#051026 0%, #071827 100%);
			color:var(--white);
			font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial;
			padding:2rem;
		}
		.container{
			width:100%;
			max-width:900px;
			background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));
			border-radius:12px;
			padding:2rem;
			box-shadow:0 10px 30px rgba(2,6,23,0.6);
			border:1px solid rgba(255,255,255,0.03);
			text-align:center;
		}
		h1{margin:0 0 .5rem 0;font-size:1.8rem;}
		p.lead{margin:0 0 2rem 0;color:var(--muted);}
		footer{
			margin-top:2rem;
			color:var(--muted);
			font-size:.9rem;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>&#128640 Nouvelle Page ! &#128640</h1>
		<p class="lead">Vous avez été redirigé depuis /old vers /new</p>
		<p>Cette est la nouvelle page après la redirection !</p>
		<footer>
			&copy; 2025 Webmed Int. !
		</footer>
	</div>
</body>
</html>
