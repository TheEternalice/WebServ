<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Page de Test Complète</title>
    <style>
        body {
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #0077cc;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #eee;
            padding: 10px;
        }
        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #0077cc;
        }
        section {
            padding: 20px;
        }
        article {
            background-color: #fff;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }
        footer {
            background-color: #0077cc;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        button {
            background-color: #0077cc;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #005fa3;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bienvenue sur le Serveur HTTP de Test !</h1>
    </header>

    <nav>
        <a href="#">Accueil</a>
        <a href="#">Articles</a>
        <a href="#">Contact</a>
    </nav>

    <section>
        <article>
            <h2>Article 1</h2>
            <p>Ceci est un exemple d'article pour tester la page HTML.</p>
            <img src="https://via.placeholder.com/400x200" alt="Exemple image">
        </article>

        <article>
            <h2>Article 2</h2>
            <p>Encore un autre article pour vérifier le rendu CSS et la mise en page.</p>
            <button onclick="alert('Bouton cliqué !')">Cliquez-moi</button>
        </article>

        <article>
            <h2>Formulaire</h2>
            <form action="/submit" method="post">
                <label for="name">Nom :</label>
                <input type="text" id="name" name="name"><br><br>
                <label for="email">Email :</label>
                <input type="email" id="email" name="email"><br><br>
                <input type="submit" value="Envoyer">
            </form>
        </article>
    </section>

    <footer>
        &copy; 2025 Serveur HTTP de Test
    </footer>

    <script>
        console.log("Page test chargée correctement !");
    </script>
</body>
</html>
